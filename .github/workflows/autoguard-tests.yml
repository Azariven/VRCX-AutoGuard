name: AutoGuard tests and VRCX integration
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test

  vrcx-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: vrcx-team/VRCX
          ref: v2026.11.14
          path: vrcx-source
      - name: Copy AutoGuard modules and validate integration
        run: |
          mkdir -p vrcx-source/src/autoguard
          cp src/autoguard/core.js src/autoguard/accountRiskAssessment.js src/autoguard/profileThreatGuard.js src/autoguard/dashboardStore.js src/autoguard/worldFocusedScanner.js src/autoguard/friendReviewPolicy.js src/autoguard/friendReviewRuntime.js src/autoguard/socialSignalPolicy.js vrcx-source/src/autoguard/
          mkdir -p vrcx-source/src/views/AutoGuard
          cp ui/AutoGuardDashboard.vue vrcx-source/src/views/AutoGuard/AutoGuard.vue
          node scripts/apply-vrcx-integration.mjs vrcx-source
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: vrcx-source/package-lock.json
      - name: Install VRCX dependencies
        working-directory: vrcx-source
        run: npm ci
      - name: Type-check integrated VRCX
        working-directory: vrcx-source
        run: |
          npm run typecheck:js
          npm run typecheck:vue
      - name: Build VRCX renderer with AutoGuard
        working-directory: vrcx-source
        run: npm run prod

  vrcx-windows-app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: vrcx-team/VRCX
          ref: v2026.11.14
          path: vrcx-source
      - name: Copy AutoGuard modules and apply integration
        shell: pwsh
        run: |
          git -C vrcx-source config core.autocrlf false
          git -C vrcx-source reset --hard HEAD
          New-Item -ItemType Directory -Force vrcx-source/src/autoguard | Out-Null
          Copy-Item src/autoguard/core.js, src/autoguard/accountRiskAssessment.js, src/autoguard/profileThreatGuard.js, src/autoguard/dashboardStore.js, src/autoguard/worldFocusedScanner.js, src/autoguard/friendReviewPolicy.js, src/autoguard/friendReviewRuntime.js, src/autoguard/socialSignalPolicy.js -Destination vrcx-source/src/autoguard/
          New-Item -ItemType Directory -Force vrcx-source/src/views/AutoGuard | Out-Null
          Copy-Item ui/AutoGuardDashboard.vue -Destination vrcx-source/src/views/AutoGuard/AutoGuard.vue
          node scripts/apply-vrcx-integration.mjs vrcx-source
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: vrcx-source/package-lock.json
      - name: Install VRCX dependencies
        working-directory: vrcx-source
        run: npm ci
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build VRCX Electron .NET core
        working-directory: vrcx-source
        run: dotnet build 'Dotnet/VRCX-Electron.csproj' -p:Configuration=Release -p:WarningLevel=0 -p:Platform=x64 -t:"Clean;Build" -maxcpucount --runtime win-x64
      - name: Verify Electron .NET core output
        working-directory: vrcx-source
        shell: pwsh
        run: |
          $core = "build/Electron/win-x64/VRCX-Electron.cjs"
          if (!(Test-Path $core)) { throw "Missing required Electron core: $core" }
      - name: Build VRCX renderer
        working-directory: vrcx-source
        run: npm run prod
      - name: Build Windows VRCX installer
        working-directory: vrcx-source
        run: npm run build-electron
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: vrcx-autoguard-windows-installer
          path: vrcx-source/build/*Setup*x64.exe
          if-no-files-found: error
